# Nightly — the expensive gates that would make every PR wait for no reason.
#
# MON-209: mutation testing (mutmut) over the rule modules, the legality gate and (MON-732)
# the reducer, with a >=80% kill-rate gate that fails the job, plus the `slow`-marked test
# lane. Neither of these belongs on the PR path (mutmut alone runs the suite once per
# surviving mutant), so this workflow carries no `pull_request:` and no `push:` trigger —
# schedule and a manual button only.
name: Nightly

on:
  schedule:
    # 03:17 UTC daily. Off the hour so it does not stack with everyone else's cron.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation kill-rate gate (rules/ + legality.py + reducer.py)
    runs-on: ubuntu-latest
    # Measured, not guessed: once MON-209's gate could actually run, `mutmut run` went past **82
    # minutes** without finishing on a dispatched run. That is not a hang — it is what mutation
    # testing costs when every mutant re-runs a slice of an 820-test suite — but an unbounded job
    # inherits GitHub's six-hour default, and a nightly that might burn six hours is one nobody will
    # leave scheduled. 120 minutes is generous against the measurement.
    #
    # MON-732 raised this to 130 on top of that measurement, because `reducer.py` joined
    # `source_paths` in the same change and the 82-minute figure predates it. Reasoning, done
    # without running mutmut (Linux-only — can't run it on this machine):
    #   * the 2026-08-05 nightly (`docs/BACKLOG.md`) recorded 3,285/3,445 mutants over the
    #     2,865 raw lines that made up `rules/` + `legality.py` at the time — ~1.20 mutants
    #     per raw line, a ratio that already reflects `mutate_only_covered_lines=true` pruning
    #     docstrings, blanks and uncovered defensive branches out of the count.
    #   * `reducer.py` is 211 raw lines, but unusually documentation-heavy even by this
    #     engine's ~30%-density norm (per the 2026-08-07 audit): ~57 lines of docstring, ~37 of
    #     imports, ~14 blank, and 8 `# pragma: no cover` defensive branches `is_legal` already
    #     makes unreachable (so mutate_only_covered_lines skips them regardless) — leaving
    #     roughly 80-90 lines actually eligible for mutation.
    #   * applying the measured ratio to that eligible-line count gives ~95-110 new mutants;
    #     applying it to the full 211 raw lines instead (no adjustment, the pessimistic case)
    #     gives ~250. Call the honest range 90-250 additional mutants, i.e. a 2.6%-7.3% growth
    #     in the total mutant count mutmut has to run.
    #   * time scales with mutant count more than with which file a mutant sits in (each
    #     mutant re-runs a slice of the same suite), so expected runtime grows by the same
    #     2.6%-7.3% — 82 * 1.073 ≈ 88 minutes in the pessimistic case. Scaling the timeout by
    #     that same factor to hold the measured margin steady: 120 * 1.073 ≈ 129, rounded up
    #     to 130. The next dispatched run's `::notice::` finish time (below) is the real check;
    #     if the pessimistic case understates it, that run is the signal to raise this again.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync (runtime + dev)
        run: uv sync --frozen

      # mutmut's own process exit code is not a trustworthy pass/fail signal here (it
      # reflects the last child status, not the overall kill-rate), so this step is
      # allowed to finish non-zero — the gate below reads `mutmut results` and decides.
      #
      # `working-directory` is load-bearing and not tidiness: mutmut reads
      # `[tool.mutmut]` from the `pyproject.toml` beside it and only understands a
      # `src/` + `tests/` project. Run from the workspace root it built a `mutants/`
      # tree with no test suite in it, so pytest never started — see the long comment
      # on `[tool.mutmut]` in `packages/engine/pyproject.toml`.
      - name: Run mutmut over the rule modules, the legality gate and the reducer
        working-directory: packages/engine
        run: uv run mutmut run || true

      - name: Enforce >=80% kill-rate
        working-directory: packages/engine
        run: |
          # How long the run actually took, printed whether it passed or failed: the figure that
          # decides whether the timeout above is still the right one.
          echo "::notice::mutmut finished at $(date -u +%H:%M:%SZ)"
          # `--all=true`, not `--all`: mutmut 3.6.0 declares the option as
          # `@click.option("--all", default=False)` with no `is_flag=True`, so click
          # demands a value and a bare `--all` fails with "Option '--all' requires an
          # argument." That failure was invisible behind `|| true` until the gate below
          # reported zero mutants.
          uv run mutmut results --all=true > mutmut-results.txt || true
          cat mutmut-results.txt
          uv run python - <<'PY'
          import sys

          KILL_RATE_THRESHOLD = 0.80

          with open("mutmut-results.txt", encoding="utf-8") as f:
              lines = [line.strip() for line in f if line.strip()]

          statuses = []
          for line in lines:
              # `mutmut results --all` prints one "<mutant key>: <status>" line per
              # mutant, e.g. "is_legal__mutmut_3: killed".
              if ":" not in line:
                  continue
              _, _, status = line.rpartition(":")
              statuses.append(status.strip())

          total = len(statuses)
          if total == 0:
              print("::error::mutmut reported zero mutants for rules/, legality.py and "
                    "reducer.py — treating this as a failure, not a silent pass")
              sys.exit(1)

          killed = sum(1 for s in statuses if s == "killed")
          rate = killed / total
          print(f"mutation kill-rate: {killed}/{total} = {rate:.1%}")

          if rate < KILL_RATE_THRESHOLD:
              print(f"::error::mutation kill-rate {rate:.1%} is below the "
                    f"{KILL_RATE_THRESHOLD:.0%} gate (MON-209)")
              sys.exit(1)
          PY

      - name: Upload mutmut cache for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: |
            packages/engine/mutmut-results.txt
            packages/engine/mutants/
          retention-days: 7
          if-no-files-found: ignore

  slow-tests:
    name: Slow-marked tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync (runtime + dev)
        run: uv sync --frozen

      # `-m slow` on the command line lands after the `-m "not slow"` in pyproject's addopts
      # and wins, so this is the inverse of the PR gate's selection rather than an addition
      # to it. MON-603's bot contests are what live here: two hundred full games with a rollout
      # search in half the seats — tens of minutes, and a wall-clock nobody asserts on (G-F30).
      #
      # Exit code 5 ("no tests collected") used to be tolerated here, because for two
      # milestones there were no slow-marked tests to collect. It is a **failure** now: an
      # empty slow lane means the marker or this selection has broken, and a silent pass is
      # exactly how a strength gate stops being run without anybody noticing.
      #
      # `-s` because the contests *report* numbers as well as asserting them — the win/draw/capped
      # split, the turn distribution, and the wall-clock. Those are metrics a human reads in this log;
      # pytest only shows captured stdout for tests that fail, and a passing contest whose runtime has
      # quietly tripled is exactly the thing worth seeing.
      - name: Pytest -m slow
        run: uv run pytest -m slow -s

  bundle-size:
    name: Bundle-size floor (packages/web dist/ JS)
    runs-on: ubuntu-latest
    # MON-911: the JS payload is the number `docs/DEPLOYMENT.md` §"What that costs" promises a
    # player before the loading screen even starts. Nightly, not the PR gate — same reasoning as
    # the mutation job above: a size regression is a trend worth catching quickly, not a reason
    # to block every unrelated diff on a full build. `workflow_dispatch` (already on this
    # workflow) lets this be proven on demand right after it merges, without waiting for 03:17 UTC.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - run: npm ci
        working-directory: packages/web

      # Same build `deploy-pages.yml` runs (local engine, Pages base path, the live API URL),
      # so the bytes measured below are the bytes a real player's browser downloads — not some
      # other Vite mode nobody ships.
      - name: Build (matches deploy-pages.yml)
        working-directory: packages/web
        env:
          VITE_ENGINE: local
          VITE_BASE: /monopoly/
          VITE_API_URL: https://kesef-street-api.onrender.com
        run: npm run build

      # Measured 2026-08-07: dist/assets/*.js totalled 506,139 bytes (~506 kB) — already above
      # DEPLOYMENT.md's ~450 kB figure, because MON-727/MON-728 (one build serving both modes,
      # the shared-link join flow) added real code since that number was written (MON-749 tracks
      # the doc update). The floor below is that measurement plus ~10% headroom, not the stale
      # doc figure, so this gate reflects the bundle as it actually is today, not as documented.
      - name: Enforce the JS bundle-size floor
        working-directory: packages/web
        run: |
          THRESHOLD_BYTES=556753
          TOTAL_BYTES=$(find dist -name '*.js' -type f -exec stat -c%s {} \; | awk '{sum += $1} END {print sum}')
          echo "dist/ JS total: ${TOTAL_BYTES} bytes (floor: ${THRESHOLD_BYTES} bytes)"
          if [ -z "${TOTAL_BYTES}" ] || [ "${TOTAL_BYTES}" -eq 0 ]; then
            echo "::error::found no JS under dist/ — treating this as a failure, not a silent pass"
            exit 1
          fi
          if [ "${TOTAL_BYTES}" -gt "${THRESHOLD_BYTES}" ]; then
            echo "::error::dist/ JS grew to ${TOTAL_BYTES} bytes, over the ${THRESHOLD_BYTES}-byte floor (MON-911)"
            exit 1
          fi
