# CI — the same gate a human runs locally, so "works on my machine" and "CI is green"
# mean the same thing.
#
# The golden rule inherited from claude-stream: a passing `ruff check` is NOT a passing
# `ruff format --check`. Both run, as separate steps, so a failure names itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # hashFiles() is a STEP-scope function; using it in a job-level `if` makes the whole
  # workflow invalid (zero jobs, immediate failure — how M0's CI died on first contact
  # with GitHub). This job does the file checks on a real runner and exposes them as
  # outputs the other jobs can legally reference.
  gate:
    name: Which gates apply
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
      contract: ${{ steps.check.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          echo "web=$([ -f packages/web/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "contract=$([ -f packages/web/src/api/generated.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  python:
    name: Python gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync (runtime + dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

      # MON-301 acceptance: `packages/server/src` coverage >= 95%, enforced rather than
      # asserted in a backlog bullet. Scoped to the server package and its own tests, so
      # the engine's much larger surface cannot carry a thin transport over the line.
      - name: Server coverage floor
        run: uv run pytest packages/server/tests -q --cov=kesef_server --cov-fail-under=95

      # MON-107: goldens are committed artifacts, never a test-run side effect. A diff
      # here means something regenerated them silently — that is a failure by design.
      # A plain `git diff` cannot see a *new* untracked golden, so the check is on the
      # porcelain status of the directory: modified, deleted or added all fail here.
      - name: Goldens unchanged after tests
        run: |
          status="$(git status --porcelain -- packages/engine/tests/goldens/)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::tests changed packages/engine/tests/goldens/ - goldens are committed artifacts"
            exit 1
          fi

      - name: pip-audit
        run: uv run pip-audit

  web:
    name: Web gate
    runs-on: ubuntu-latest
    # Activates when the frontend gains a lockfile (MON-401). Until then this job is
    # skipped rather than red, so the repo can be green while the UI is scaffolded.
    needs: gate
    if: needs.gate.outputs.web == 'true'
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - run: npm ci

      # MON-911: `npm audit` alone always exits 0 for a human to read later; `--audit-level=high`
      # is what turns it into a gate that fails the job on a new high/critical advisory.
      #
      # Scoped to `--omit=dev` — the gate guards what ships (the production dependency tree of
      # the published site), which is clean today (checked 2026-08-07). Dev-tree advisories are
      # Dependabot's job (added in this same PR, weekly, grouped), because the two open today
      # are exactly the kind a hard gate cannot fix and should not hide:
      #   - `js-yaml` (GHSA-5p4m-2wfm-xmqj, high, dev): nested inside
      #     `@redocly/openapi-core@1.34.18`, which `openapi-typescript@7.13.0` pins exactly; the
      #     fixed js-yaml is a major (5.x) and `openapi-typescript` is deliberately version-pinned
      #     (see the `contract` job below), so the fix arrives via upstream, not an override.
      #   - `vitest` (GHSA-5xrq-8626-4rwp, critical, dev): the fix is `vitest@4.1.10`, a major
      #     bump from `^2.1.8` — filed as its own backlog item rather than forced through as a
      #     side effect of a CI-hygiene change. The vulnerable surface (the vitest UI server
      #     listening) never runs in CI (`vitest --run`, no `--ui`).
      # `brace-expansion` and `fast-uri` (both high) WERE fixed in this same PR via a
      # lockfile-only `npm audit fix` — no `package.json` range changed.
      - name: npm audit (production dependency tree)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (RTL geometry)
    runs-on: ubuntu-latest
    # The only job with a layout engine behind it. M4 shipped a board that overflowed its
    # container at every viewport width and 646 passing Vitest tests could not see it, because
    # jsdom has no layout engine — `scrollHeight` is 0 for every element in all of them. MON-502
    # needs a geometric answer to "does the board mirror", so this surface was brought forward
    # from MON-707 rather than left to M7.
    needs: gate
    if: needs.gate.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      # Both toolchains, unlike the `web` job: these specs drive the real stack — uvicorn serving
      # the engine, Vite proxying `/api` to it — so a proxy bug is in scope alongside a layout bug.
      # A mocked edge is what the Vitest suite already covers.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web

      # Chromium only, and `--with-deps` because a bare runner has none of the shared libraries it
      # needs. One browser: the bugs this catches are this application's layout and transport, not a
      # rendering difference between engines.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Playwright
        run: npm run test:e2e
        working-directory: packages/web

      # The trace and screenshots for a failed geometric assertion are the whole diagnosis — a
      # number out of range says nothing about *where* the layout went.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    # The frontend's types are generated from the server's OpenAPI document. This job
    # regenerates them and fails if the committed types have drifted (MON-302).
    #
    # Gated on generated.ts, NOT the lockfile: the lockfile lands at MON-401 but the
    # openapi export module and the committed types only exist from MON-302. Gating on
    # the lockfile would turn CI red for the whole gap between the two.
    needs: [python, gate]
    if: needs.gate.outputs.contract == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Export OpenAPI
        run: uv run python -m kesef_server.openapi > openapi.json
      # Version-pinned on purpose: `npx openapi-typescript` resolves the latest release,
      # so an upstream patch that changes one line of emitted formatting would fail this
      # job as "contract drift" on a PR that touched nothing. The pin is the version in
      # packages/web/package-lock.json, which is what `npm run api:generate` uses locally.
      - name: Generate types and diff
        run: |
          npx --yes openapi-typescript@7.13.0 openapi.json -o /tmp/generated.ts
          diff -u packages/web/src/api/generated.ts /tmp/generated.ts
