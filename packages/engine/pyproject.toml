# kesef-engine — the rules core.
#
# HARD RULE: this package performs no I/O beyond reading its own bundled board
# JSON, imports no web framework, and knows nothing about HTTP, React, or the
# terminal. Everything here is `apply(state, command) -> (state, events)`.
# If you are about to add a dependency, that is a design smell — see ADR-002.
[project]
name = "kesef-engine"
version = "0.1.0"
description = "Pure-Python rules engine for a property-trading board game: deterministic, serializable, UI-agnostic"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Guy Flenner" }]
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
# The text-mode driver. Proves the rules are correct before any pixel is drawn.
kesef = "kesef_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kesef_engine"]

# ---------------------------------------------------------------------------
# mutmut — mutation testing over the rule modules and the legality gate (MON-209).
#
# **It lives here, and the nightly runs it from this directory, because mutmut only
# understands a `src/` + `tests/` layout.** Run from the workspace root — which is
# where it was — mutmut walks `source_paths` and nothing else to build its
# `mutants/` copy, so that copy contained `rules/` and `legality.py` and *nothing
# else*: no `packages/engine/tests`, so pytest was handed a path that did not exist
# and failed to start at all (`BadTestExecutionCommandsException`); and no
# `kesef_engine/__init__.py`, so `import kesef_engine` would have found the
# *installed* package instead and every mutant would have survived. A gate that
# reports 0% is at least loud; one that silently tests unmutated code is worse.
#
# From here the layout is the one mutmut assumes: `mutants/src` goes on `sys.path`
# and the editable install of this same `src/` comes off it, so the mutated module is
# the one the tests import.
# ---------------------------------------------------------------------------
[tool.mutmut]
# MON-732: `reducer.py` joins the scope. The phase machine (`_dispatch`) and the interrupt
# stack drain (`_drain`) are the design's own self-declared hardest parts (ADR-007), and until
# now they sat outside the only gate that measures test *strength* rather than coverage —
# `is_legal`/`apply` agreement and the goldens both hold the boundary fixed, so a mutant here
# could survive both. `mutate_only_covered_lines=true` (below) already bounds the added cost:
# reducer.py is 211 lines, most of it docstring and imports, and the handful of `# pragma: no
# cover` defensive branches (`is_legal` already rejects the command shapes they guard) carry no
# coverage and so mutmut skips them regardless.
#
# `state.py` deliberately does NOT join this list. Its pydantic validators mutate into
# pydantic's own internals (`model_validator`/`field_validator` machinery, `ConfigDict`
# resolution) rather than into rule logic mutmut can reason about the same way — out of scope
# per the backlog item (MON-732), not an oversight.
source_paths = [
    "src/kesef_engine/rules",
    "src/kesef_engine/legality.py",
    "src/kesef_engine/reducer.py",
]

# The whole package and the whole suite, because `source_paths` is a *mutation*
# scope and not a copy list. `src/kesef_engine` brings the `__init__.py`, the state
# model and the bundled board JSON the rules import; `tests` is the suite that does
# the killing. Copied *before* the mutants are generated (`_run` calls
# `copy_src_dir` → `copy_also_copy_files` → `create_mutants`), so the mutated files
# are the last word rather than being overwritten by the originals.
also_copy = [
    "src/kesef_engine",
    "tests",
]

pytest_add_cli_args_test_selection = ["tests"]

# Mutate only the lines the tests actually execute.
#
# This is a *correctness* setting before it is a speed one. A mutant on a line no test touches always
# survives, so including those measures **coverage** rather than test strength — and MON-209's gate is
# about strength: "do the tests notice when a rule changes". The engine sits at 91% line coverage, so
# little is excluded, and what is excluded would otherwise drag the figure down while telling us
# something `--cov` already says more clearly.
#
# It costs a coverage pass up front and removes mutants from the run, which is also the lever that
# brings the job back under its timeout — see the comment on `timeout-minutes` in the nightly.
mutate_only_covered_lines = true
